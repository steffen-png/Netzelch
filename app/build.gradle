plugins {
    id "com.android.application"
}

// Jeder GitHub-Build bekommt eine höhere Versionsnummer, damit die App Updates erkennt.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace "de.netzelch.hallowelt"
    compileSdk 35

    defaultConfig {
        applicationId "de.netzelch.hallowelt"
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    // Fester Schlüssel: Updates müssen mit demselben Schlüssel signiert sein
    // wie die installierte App, sonst lehnt Android sie ab.
    signingConfigs {
        shared {
            storeFile file("netzelch.keystore")
            storePassword "netzelch"
            keyAlias "netzelch"
            keyPassword "netzelch"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
