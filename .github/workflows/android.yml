name: Android APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: APK bauen
        run: gradle assembleDebug

      - name: APK umbenennen
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HalloWelt.apk
          cp reanimation/build/outputs/apk/debug/reanimation-debug.apk Reanimation.apk
          echo "$GITHUB_RUN_NUMBER" > version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HalloWelt-apk
          path: |
            HalloWelt.apk
            Reanimation.apk

      - name: Als Download-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete hallo-welt --cleanup-tag -y || true
          gh release create hallo-welt HalloWelt.apk version.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Hallo Welt 1.$GITHUB_RUN_NUMBER" \
            --notes "Auf dem Handy HalloWelt.apk antippen und installieren."
          gh release delete reanimation --cleanup-tag -y || true
          gh release create reanimation Reanimation.apk version.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Reanimation 1.$GITHUB_RUN_NUMBER" \
            --notes "Auf dem Handy Reanimation.apk antippen und installieren."
